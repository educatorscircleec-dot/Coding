[project]
name = "studio"
version = "0.1.0"
description = "Pipeline for producing an AI-animated series"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "pillow>=10"]

[project.optional-dependencies]
ai = ["huggingface_hub>=0.25", "gradio_client>=1.3"]
voice = ["kokoro-onnx>=0.4", "soundfile>=0.12", "numpy"]
dev = ["pytest>=8"]

[project.scripts]
studio = "studio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studio*"]
