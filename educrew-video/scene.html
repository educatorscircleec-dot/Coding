<!doctype html>
<html><head><meta charset="utf-8"><title>EduCrew Miniature World</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:540px;height:960px}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// EduCrew Academic Solutions — 30s vertical miniature-world commercial.
// Every frame is a pure function of time t: window.renderFrame(t).
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const sceneC = mk(), sc = sceneC.getContext('2d');
const maskC = mk(), mc = maskC.getContext('2d');

// ---------- utilities ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, e) => a + (b - a) * e;
const sm = e => { e = clamp(e); return e * e * e * (e * (e * 6 - 15) + 10); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (t, a, b) => sm(prog(t, a, b));
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function ellipse(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, Math.max(rx, .1), Math.max(ry, .1), 0, 0, Math.PI * 2); }
const SERIF = '"Caladea", "Liberation Serif", serif';
const SANS = '"Inter", "Liberation Sans", sans-serif';

// ---------- logo (original file if supplied in assets/logo.png) ----------
let LOGO = null;
const logoImg = new Image();
logoImg.onload = () => { LOGO = logoImg; };
logoImg.src = 'assets/logo.png';
window.logoReady = () => new Promise(r => { if (logoImg.complete) r(!!LOGO); else { logoImg.onload = () => { LOGO = logoImg; r(true); }; logoImg.onerror = () => r(false); } });

function drawLogoPlaceholder(c, cx, cy, size, light) {
  // Neutral stand-in used ONLY when assets/logo.png is absent. Replace with the original logo.
  c.save(); c.translate(cx, cy);
  const r = size / 2;
  c.fillStyle = light ? 'rgba(255,255,255,.92)' : '#1f2b4d';
  ellipse(c, 0, 0, r, r); c.fill();
  c.strokeStyle = '#d6a64a'; c.lineWidth = size * .05; ellipse(c, 0, 0, r * .86, r * .86); c.stroke();
  c.fillStyle = light ? '#1f2b4d' : '#fff';
  c.font = `700 ${size * .36}px ${SERIF}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('EC', 0, size * .02);
  c.restore();
}
function drawLogo(c, cx, cy, size, light) {
  if (LOGO) {
    const ar = LOGO.width / LOGO.height; let w = size, h = size;
    if (ar > 1) h = size / ar; else w = size * ar;   // keep original proportions, never distort
    c.drawImage(LOGO, cx - w / 2, cy - h / 2, w, h);
  } else drawLogoPlaceholder(c, cx, cy, size, light);
}

// ---------- palette ----------
const P = {
  wall: '#f1e6d4', wall2: '#e8d9c2', wains: '#a9bfa2', wainsD: '#91a98b',
  floorA: '#c08f5c', floorB: '#9b6a3f', deskTop: '#e9dcc8', deskFront: '#6f4a33', deskFront2: '#835a3f',
  navy: '#24345c', gold: '#d6a64a', ink: '#1d2333'
};

// ---------- women ----------
const WOMEN = [
  { skin: '#c98e6b', hair: '#2a1b14', style: 'bun', top: '#2c3e66', lapel: '#f4efe6', bottom: '#5b6170', skirt: true },
  { skin: '#8d5a3b', hair: '#140d0a', style: 'long', top: '#8a2b3a', lapel: '#d9b36a', bottom: '#efe4d0', skirt: false, kurta: true },
  { skin: '#e0b08c', hair: '#2f7f7a', style: 'hijab', top: '#d8c3a5', lapel: '#ffffff', bottom: '#2d2f3a', skirt: false },
  { skin: '#a8724f', hair: '#4a2c1c', style: 'bob', top: '#d9a441', lapel: '#fff7e6', bottom: '#27365a', skirt: false },
  { skin: '#d8a07c', hair: '#3b2216', style: 'pony', top: '#c9727f', lapel: '#f9e9ec', bottom: '#c9727f', skirt: true, dress: true }
];
const depthK = y => 0.85 + (y - 1300) * 0.0007;

function ik(sx, sy, tx, ty, L1, L2, side) {
  let dx = tx - sx, dy = ty - sy, d = Math.hypot(dx, dy);
  const maxd = L1 + L2 - 0.5;
  if (d > maxd) { dx *= maxd / d; dy *= maxd / d; d = maxd; }
  if (d < 10) d = 10;
  const a = Math.atan2(dy, dx);
  const cosB = clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
  const b = Math.acos(cosB) * (side > 0 ? -1 : 1);
  const ex = sx + Math.cos(a + b) * L1, ey = sy + Math.sin(a + b) * L1;
  return [ex, ey, sx + dx, sy + dy];
}

// st: {x,y,k,facing:'front'|'back', walk:phase|null, L:[x,y] local, R:[x,y] local, hold, look, nod}
function drawWoman(c, w, st, t) {
  const k = st.k ?? depthK(st.y);
  c.save(); c.translate(st.x, st.y); c.scale(k, k);
  const front = st.facing !== 'back';
  const walking = st.walk != null;
  const ph = st.walk || 0;
  const bob = walking ? -Math.abs(Math.sin(ph)) * 5 : Math.sin(t * 1.7 + w.seed) * 1.2;
  // contact shadow
  c.fillStyle = 'rgba(40,20,5,.28)'; ellipse(c, 0, 2, 48, 11); c.fill();
  c.fillStyle = 'rgba(40,20,5,.18)'; ellipse(c, 0, 2, 70, 15); c.fill();
  c.translate(0, bob);
  // legs
  const swing = walking ? Math.sin(ph) * 0.38 : 0;
  const legs = [[-11, swing], [11, -swing]];
  for (const [hx, a] of legs) {
    const fx = hx + Math.sin(a) * 196, fy = -200 + Math.cos(a) * 196;
    c.lineCap = 'round';
    c.strokeStyle = (w.skirt ? w.skin : w.bottom); c.lineWidth = w.skirt ? 13 : 19;
    c.beginPath(); c.moveTo(hx, -205); c.lineTo(fx, fy - 8); c.stroke();
    if (w.skirt) { c.strokeStyle = 'rgba(0,0,0,.12)'; c.lineWidth = 13; c.beginPath(); c.moveTo(hx, -150); c.lineTo(fx, fy - 8); c.stroke(); }
    c.fillStyle = '#1b1414'; ellipse(c, fx + (front ? 0 : 0), fy - 4, 12, 6); c.fill();
  }
  // hair behind (long / pony seen from front)
  const hc = w.hair;
  if (front && w.style === 'long') { c.fillStyle = hc; rr(c, -29, -398, 58, 112, 22); c.fill(); }
  // lower garment
  if (w.skirt || w.kurta) {
    c.fillStyle = w.kurta ? w.top : w.bottom;
    const hem = w.kurta ? -140 : (w.dress ? -128 : -132);
    c.beginPath(); c.moveTo(-27, -228); c.lineTo(27, -228); c.lineTo(36 + swing * 10, hem); c.lineTo(-36 + swing * 10, hem); c.closePath(); c.fill();
    c.fillStyle = 'rgba(0,0,0,.10)'; c.fillRect(-2, -226, 4, hem + 226);
    if (w.kurta) { c.fillStyle = w.lapel; c.fillRect(-36 + swing * 10, hem - 8, 72, 6); }
  } else {
    c.fillStyle = w.bottom; c.beginPath(); c.moveTo(-27, -228); c.lineTo(27, -228); c.lineTo(25, -196); c.lineTo(-25, -196); c.closePath(); c.fill();
  }
  // arms behind body (back view reaching forward)
  const SL = [-33, -326], SR = [33, -326];
  const restL = [-40, -205], restR = [40, -205];
  const L = st.L || restL, R = st.R || restR;
  const armCol = w.dress ? w.top : w.top;
  const drawArm = (S, T, side) => {
    const [ex, ey, hx, hy] = ik(S[0], S[1], T[0], T[1], 78, 74, side);
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.strokeStyle = armCol; c.lineWidth = 16;
    c.beginPath(); c.moveTo(S[0], S[1]); c.lineTo(ex, ey); c.lineTo(hx, hy); c.stroke();
    c.strokeStyle = 'rgba(0,0,0,.10)'; c.lineWidth = 5; c.beginPath(); c.moveTo(ex, ey); c.lineTo(hx, hy); c.stroke();
    c.fillStyle = w.skin; ellipse(c, hx, hy, 7.5, 7.5); c.fill();
    return [hx, hy];
  };
  // torso
  c.fillStyle = w.top;
  c.beginPath(); c.moveTo(-36, -334); c.quadraticCurveTo(-40, -300, -28, -226); c.lineTo(28, -226); c.quadraticCurveTo(40, -300, 36, -334);
  c.quadraticCurveTo(0, -344, -36, -334); c.fill();
  if (front) {
    c.fillStyle = w.lapel;
    c.beginPath(); c.moveTo(-11, -338); c.lineTo(0, -292); c.lineTo(11, -338); c.closePath(); c.fill();
    if (!w.kurta && !w.dress) { c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-12, -337); c.lineTo(-2, -262); c.moveTo(12, -337); c.lineTo(2, -262); c.stroke(); }
    // ID badge on lanyard
    c.strokeStyle = '#2f6f9a'; c.lineWidth = 2; c.beginPath(); c.moveTo(-9, -336); c.lineTo(-4, -282); c.moveTo(9, -336); c.lineTo(4, -282); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-7, -283, 14, 18); c.fillStyle = P.gold; c.fillRect(-7, -283, 14, 4);
  } else {
    c.strokeStyle = 'rgba(0,0,0,.12)'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, -336); c.lineTo(0, -230); c.stroke();
  }
  c.fillStyle = 'rgba(0,0,0,.08)'; c.fillRect(-28, -236, 56, 8);
  // neck & head
  const nod = st.nod || 0, look = st.look || 0;
  c.fillStyle = w.skin; c.fillRect(-6, -352, 12, 18);
  const hx0 = look * 3, hy0 = -373 + nod;
  if (w.style === 'hijab') {
    c.fillStyle = hc; ellipse(c, hx0, hy0 + 4, 31, 36); c.fill();
    c.beginPath(); c.moveTo(-30, hy0 + 10); c.quadraticCurveTo(0, -318, 30, hy0 + 10); c.lineTo(38, -322); c.quadraticCurveTo(0, -306, -38, -322); c.closePath(); c.fill();
    if (front) { c.fillStyle = w.skin; ellipse(c, hx0 + look * 2, hy0 + 3, 18, 23); c.fill(); }
  } else {
    c.fillStyle = w.skin; ellipse(c, hx0, hy0, 22, 27); c.fill();
    c.fillStyle = hc;
    if (!front) { ellipse(c, hx0, hy0 - 2, 24, 29); c.fill(); }
    else {
      c.beginPath(); c.ellipse(hx0, hy0 - 6, 24, 23, 0, Math.PI, 0); c.fill();
      c.beginPath(); c.moveTo(hx0 - 24, hy0 - 6); c.quadraticCurveTo(hx0 - 4 + look * 6, hy0 - 2, hx0 + 24, hy0 - 10); c.lineTo(hx0 + 24, hy0 - 6); c.closePath(); c.fill();
    }
    if (w.style === 'bun') { ellipse(c, hx0, hy0 - 30, 13, 11); c.fill(); }
    if (w.style === 'bob') { rr(c, hx0 - 26, hy0 - 12, 10, 34, 5); c.fill(); rr(c, hx0 + 16, hy0 - 12, 10, 34, 5); c.fill(); if (!front) { rr(c, hx0 - 26, hy0 - 10, 52, 34, 10); c.fill(); } }
    if (w.style === 'pony') { const sw = Math.sin(t * 3 + (walking ? ph : 0)) * 4; c.beginPath(); c.moveTo(hx0 + 10, hy0 - 22); c.quadraticCurveTo(hx0 + 32 + sw, hy0 - 5, hx0 + 22 + sw, hy0 + 30); c.lineWidth = 11; c.strokeStyle = hc; c.lineCap = 'round'; c.stroke(); }
    if (w.style === 'long') { if (!front) { rr(c, hx0 - 27, hy0 - 20, 54, 92, 18); c.fill(); } else { rr(c, hx0 - 27, hy0 - 12, 9, 50, 4); c.fill(); rr(c, hx0 + 18, hy0 - 12, 9, 50, 4); c.fill(); } }
  }
  if (front) {
    const fx = hx0 + look * 5, fy = hy0 + 3;
    c.fillStyle = '#1f1612'; ellipse(c, fx - 8, fy - 1, 2.6, 3); c.fill(); ellipse(c, fx + 8, fy - 1, 2.6, 3); c.fill();
    c.fillStyle = 'rgba(220,90,90,.22)'; ellipse(c, fx - 12, fy + 8, 5, 3); c.fill(); ellipse(c, fx + 12, fy + 8, 5, 3); c.fill();
    c.strokeStyle = '#8c3b3b'; c.lineWidth = 2; c.beginPath(); c.arc(fx, fy + 9, 5, 0.2, Math.PI - 0.2); c.stroke();
    if (w.style !== 'hijab') { c.fillStyle = '#e8c35a'; ellipse(c, hx0 - 22, hy0 + 8, 2.4, 2.4); c.fill(); ellipse(c, hx0 + 22, hy0 + 8, 2.4, 2.4); c.fill(); }
  }
  // arms + held items
  const hL = drawArm(SL, L, -1), hR = drawArm(SR, R, 1);
  if (st.hold) st.hold(c, hL, hR, t);
  c.restore();
}

// held items (local coords of figure)
const HOLD = {
  books: (c, L, R) => {
    const cx = (L[0] + R[0]) / 2, cy = (L[1] + R[1]) / 2;
    const cols = ['#2e6fb5', '#d1495b', '#3c9d6e', '#f0b429', '#7b5ea7'];
    for (let i = 0; i < 5; i++) { c.fillStyle = cols[i]; rr(c, cx - 30 + (i % 2) * 3, cy - 6 - i * 10, 60, 10, 2); c.fill(); c.fillStyle = 'rgba(255,255,255,.75)'; c.fillRect(cx - 26 + (i % 2) * 3, cy - 3 - i * 10, 52, 2); }
  },
  paper: (c, L, R) => { const cx = (L[0] + R[0]) / 2, cy = (L[1] + R[1]) / 2; c.fillStyle = '#fffdf7'; c.fillRect(cx - 20, cy - 34, 40, 50); c.fillStyle = '#9aa3b5'; for (let i = 0; i < 6; i++) c.fillRect(cx - 15, cy - 27 + i * 7, i % 3 === 2 ? 18 : 30, 2); },
  book: (c, L, R) => { const cx = (L[0] + R[0]) / 2, cy = (L[1] + R[1]) / 2; c.fillStyle = '#d1495b'; c.fillRect(cx - 32, cy - 30, 64, 42); c.fillStyle = '#fffaf0'; c.fillRect(cx - 29, cy - 28, 28, 38); c.fillRect(cx + 1, cy - 28, 28, 38); c.fillStyle = '#8b93a7'; for (let i = 0; i < 5; i++) { c.fillRect(cx - 26, cy - 23 + i * 7, 22, 2); c.fillRect(cx + 4, cy - 23 + i * 7, 22, 2); } },
  clipboard: (c, L, R, t) => { c.fillStyle = '#8a5a35'; c.fillRect(L[0] - 4, L[1] - 46, 40, 54); c.fillStyle = '#fff'; c.fillRect(L[0], L[1] - 40, 32, 44); c.fillStyle = '#9aa'; for (let i = 0; i < 5; i++) c.fillRect(L[0] + 10, L[1] - 34 + i * 8, 18, 2); c.fillStyle = '#2b9a5a'; for (let i = 0; i < 5; i++) if ((t * 1.3 + i) % 5 > 1.2) c.fillRect(L[0] + 3, L[1] - 35 + i * 8, 4, 4); c.strokeStyle = '#223'; c.lineWidth = 3; c.beginPath(); c.moveTo(R[0], R[1]); c.lineTo(R[0] - 6, R[1] + 10); c.stroke(); },
  marker: (c, L, R) => { c.strokeStyle = '#1d4ed8'; c.lineWidth = 5; c.beginPath(); c.moveTo(R[0], R[1]); c.lineTo(R[0] + 4, R[1] - 14); c.stroke(); }
};

// ---------- women state machine ----------
// tracks: list of {t, x, y, facing, pose(t,st)->{L,R,hold,...}, walk:duration, walkPose}
function walkArms(ph) { const s = Math.sin(ph) * 22; return { L: [-40 - 2, -210 + s * .2 - 0 + 0, 0].slice(0, 2).map((v, i) => i ? v : v + s), R: [40 - s, -210] }; }
function poseAt(track, t) {
  let i = 0; while (i + 1 < track.length && track[i + 1].t <= t) i++;
  const cur = track[i], prev = track[i - 1];
  let st = { x: cur.x, y: cur.y, facing: cur.facing || 'front' };
  if (cur.pos) Object.assign(st, cur.pos(t));
  if (prev && cur.walk && t < cur.t + cur.walk) {
    const e = (t - cur.t) / cur.walk, ee = sm(e);
    const px = prev.endX ?? prev.x, py = prev.endY ?? prev.y;
    st.x = lerp(px, cur.x, ee); st.y = lerp(py, cur.y, ee);
    const dist = Math.hypot(cur.x - px, cur.y - py);
    st.walk = (dist * ee) / 34;
    st.facing = cur.walkFacing || (cur.y > py + 80 ? 'front' : (cur.y < py - 80 ? 'back' : 'front'));
    st.look = Math.sign(cur.x - px) * .8;
    const a = walkArms(st.walk);
    if (cur.walkPose) Object.assign(st, cur.walkPose(t, st)); else Object.assign(st, a);
    return st;
  }
  if (cur.pose) Object.assign(st, cur.pose(t, st));
  return st;
}
const toLocal = (st, X, Y) => { const k = depthK(st.y); return [(X - st.x) / k, (Y - st.y) / k]; };
const jit = (t, f, a, o = 0) => Math.sin(t * f + o) * a;

// pose builders
const typing = (kx, ky) => (t, st) => ({ L: toLocal(st, kx - 18 + jit(t, 21, 3), ky + jit(t, 17, 2)), R: toLocal(st, kx + 18 + jit(t, 19, 3, 1), ky + jit(t, 23, 2, 2)) });
const talk = (o = 0) => (t) => ({ L: [-34 + jit(t, 2.3, 10, o), -240 + jit(t, 3.1, 14, o)], R: [36 + jit(t, 2.7, 12, o + 1), -252 + jit(t, 3.7, 16, o)], look: Math.sin(t * .9 + o) * .6 });
const holding = (item, o = 0) => (t) => ({ L: [-22, -248 + jit(t, 1.4, 3, o)], R: [22, -248 + jit(t, 1.4, 3, o)], hold: HOLD[item], nod: Math.max(0, Math.sin(t * 1.6 + o)) * 3 });
const checking = (o = 0) => (t) => ({ L: [-26, -250], R: [-6 + jit(t, 5, 6, o), -268 + jit(t, 2.5, 14, o)], hold: HOLD.clipboard, nod: 3 });
const pointAt = (X, Y, o = 0) => (t, st) => ({ R: toLocal(st, X + jit(t, 2.2, 14, o), Y + jit(t, 3.1, 8, o)), L: [-28, -248], hold: HOLD.paper ? null : null, look: Math.sign(X - st.x) });

// ---------- props / screens ----------
function desk(c, x, y, w, h = 190, d = 52, col = P.deskFront) {
  c.fillStyle = 'rgba(40,20,5,.22)'; c.fillRect(x - 6, y - 4, w + 12, 14);
  c.fillStyle = col; c.fillRect(x, y - h, w, h);
  c.fillStyle = 'rgba(255,255,255,.07)'; for (let i = 1; i < 3; i++) c.fillRect(x + (w / 3) * i - 1, y - h + 10, 2, h - 20);
  c.fillStyle = 'rgba(0,0,0,.15)'; c.fillRect(x, y - h, w, 8);
  c.fillStyle = P.deskTop; c.beginPath(); c.moveTo(x - 6, y - h); c.lineTo(x + w + 6, y - h); c.lineTo(x + w - 4, y - h - d); c.lineTo(x + 4, y - h - d); c.closePath(); c.fill();
  c.fillStyle = '#d6c6ad'; c.fillRect(x - 6, y - h - 2, w + 12, 6);
  // drawers / handles
  c.fillStyle = '#c8a46a'; c.fillRect(x + w * .5 - 18, y - h + 40, 36, 4);
}
function screenFrame(c, x, y, w, h, standY) {
  if (standY) { c.fillStyle = '#3a3f4b'; c.fillRect(x + w / 2 - 8, y + h, 16, standY - y - h); c.fillRect(x + w / 2 - 40, standY - 6, 80, 8); }
  c.fillStyle = '#20232b'; rr(c, x - 9, y - 9, w + 18, h + 18, 8); c.fill();
}
function laptop(c, x, y, w, h, drawScreen, t) {
  // y = top of screen; base sits below
  c.fillStyle = '#2a2d35'; rr(c, x - 7, y - 7, w + 14, h + 14, 7); c.fill();
  c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip(); drawScreen(c, x, y, w, h, t); c.restore();
  c.fillStyle = 'rgba(255,255,255,.06)'; c.beginPath(); c.moveTo(x, y); c.lineTo(x + w * .4, y); c.lineTo(x, y + h * .6); c.fill();
  c.fillStyle = '#b9bec8'; c.beginPath(); c.moveTo(x - 16, y + h + 7); c.lineTo(x + w + 16, y + h + 7); c.lineTo(x + w + 28, y + h + 22); c.lineTo(x - 28, y + h + 22); c.closePath(); c.fill();
  c.fillStyle = '#8f95a1'; c.fillRect(x + w * .3, y + h + 11, w * .4, 4);
}
function textLine(c, s, x, y, size, col, weight = 500, font = SANS) { c.fillStyle = col; c.font = `${weight} ${size}px ${font}`; c.fillText(s, x, y); }
function typed(c, s, x, y, size, col, frac, weight = 500) {
  const n = Math.floor(s.length * clamp(frac)); textLine(c, s.slice(0, n), x, y, size, col, weight);
  return x + c.measureText(s.slice(0, n)).width;
}
function caret(c, x, y, size, t) { if (Math.sin(t * 12) > 0) { c.fillStyle = '#1d4ed8'; c.fillRect(x + 1, y - size, 2, size + 2); } }

function mathDocScreen(c, x, y, w, h, t) {
  c.fillStyle = '#fbfcff'; c.fillRect(x, y, w, h);
  c.fillStyle = '#2c5fb8'; c.fillRect(x, y, w, 16); textLine(c, 'Lesson Builder', x + 6, y + 12, 9, '#fff', 600);
  c.fillStyle = '#eef2fb'; c.fillRect(x, y + 16, 26, h - 16);
  textLine(c, 'Mathematics · Grade 6', x + 32, y + 30, 8, '#6b7280', 600);
  textLine(c, 'Lesson 3: Linear Equations', x + 32, y + 44, 11, '#111827', 700);
  const lines = ['Objective: solve 2x + 3 = 11', 'Warm-up: balance-scale model', 'Example: 3x − 4 = 8  →  x = 4', 'Practice: 6 scaffolded items'];
  const p = prog(t, 0.8, 9.8) * lines.length;
  let cx = x + 32, cy = y + 60;
  lines.forEach((s, i) => { const f = clamp(p - i); if (f > 0) { const ex = typed(c, s, x + 32, y + 60 + i * 15, 8.5, '#374151', f); if (f < 1) { cx = ex; cy = y + 60 + i * 15; } } });
  caret(c, cx, cy, 9, t);

function wrap(c, text, maxW) {
  const parts = text.split(' • ');
  if (parts.length > 1) {
    const lines = []; let cur = '';
    for (const p of parts) { const tryS = cur ? cur + ' • ' + p : p; if (c.measureText(tryS).width > maxW && cur) { lines.push(cur + ' •'); cur = p; } else cur = tryS; }
    lines.push(cur); return lines;
  }
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const s = cur ? cur + ' ' + w : w; if (c.measureText(s).width > maxW && cur) { lines.push(cur); cur = w; } else cur = s; }
  lines.push(cur); return lines;
}
function captions(c, t) {
  for (const [a, b, texts, big] of CAPS) {
    if (t < a || t > b) continue;
    const fi = ease(t, a, a + .45), fo = 1 - ease(t, b - .4, b);
    const al = Math.min(fi, fo);
    c.save(); c.globalAlpha = al;
    const fs = 50;
    c.font = `600 ${fs}px ${SERIF}`;
    let lines = [];
    texts.forEach((s, i) => { if (big && i === 0) lines.push({ s, f: `500 38px ${SANS}`, h: 52, col: '#f5d58f' }); else wrap(c, s, 880).forEach(l => lines.push({ s: l, f: `600 ${fs}px ${SERIF}`, h: 66, col: '#ffffff' })); });
    const th = lines.reduce((s, l) => s + l.h, 0) + 56;
    const y0 = 250 + (1 - fi) * 30;
    // panel
    c.fillStyle = 'rgba(18,24,44,.62)'; rr(c, 60, y0, W - 120, th, 26); c.fill();
    c.strokeStyle = 'rgba(214,166,74,.85)'; c.lineWidth = 2.5; rr(c, 72, y0 + 12, W - 144, th - 24, 18); c.stroke();
    c.fillStyle = P.gold; c.fillRect(W / 2 - 60 * fi, y0 + th - 30, 120 * fi, 4);
    c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    let yy = y0 + 28;
    lines.forEach((l, i) => {
      const le = ease(t, a + .1 + i * .12, a + .55 + i * .12);
      c.globalAlpha = al * le; c.font = l.f; c.fillStyle = l.col;
      c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 8;
      yy += l.h; c.fillText(l.s, W / 2, yy - 14 + (1 - le) * 14);
    });
    c.restore();
  }
}
