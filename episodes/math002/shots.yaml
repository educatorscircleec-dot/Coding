# MATH HACKS 002 — The Monty Hall Problem (≈45 s + EduCrew promo, vertical, ages 14+ to adults)
# A famous probability puzzle: switching doors wins 2 out of 3 times.
# Render: python -m studio mathshort math002   (free Kokoro voice, all drawn locally)
episode: math002
title: The Monty Hall Problem
series_title: MATH HACKS
resolution: [1080, 1920]
fps: 24
target_seconds: 54
music_level: 0.35
voice: { engine: kokoro, voice: af_heart, speed: 1.08 }

shots:
  - id: setup
    lines:
      - id: L01
        sticker: pose_thinking
        line: "Three doors. Behind one is a car. Behind the other two, goats."
        doors: { intro: true, banner: "1 CAR  •  2 GOATS", banner_color: yellow }
      - id: L02
        line: "You pick door one. The host, who knows where the car is, opens door three. A goat!"
        punch: true
        doors: { picked: 1, open: { 3: goat }, open_at: 0.55 }
      - id: L03
        line: "Then he asks: do you want to switch to door two?"
        doors: { picked: 1, open: { 3: goat }, animate_open: false, ask: [1, 2] }

  - id: twist
    lines:
      - id: L04
        sticker: big_ideas
        line: "Most people say it doesn't matter. Fifty-fifty, right? Wrong!"
        punch: true
        doors: { picked: 1, open: { 3: goat }, animate_open: false, stamp: "50 / 50 ?", cross: true }
      - id: L05
        line: "Switching wins two times out of three."
        punch: true
        doors: { picked: 1, open: { 3: goat }, animate_open: false, banner: "SWITCH = 2/3 WIN", labels: { 2: "2/3" }, labels_at: 0.3 }

  - id: why
    lines:
      - id: L06
        line: "Here's why. Your first pick had a one in three chance, and that never changes."
        doors: { picked: 1, labels: { 1: "1/3" }, labels_at: 0.35 }
      - id: L07
        line: "The other two doors share two in three. When the host opens a goat door, all of that chance moves to the last door."
        doors: { picked: 1, labels: { 1: "1/3" }, animate_open: true, open: { 3: goat }, open_at: 0.45,
                 group: { doors: [2, 3], text: "2/3" }, move_group_to: 2, move_at: 0.6 }
      - id: L07b
        line: "Still not sure? Imagine a hundred doors. You pick one, and the host opens ninety-eight goats. Now would you switch?"
        punch: true
        doors: { hundred: true, keep: 57, open_at: 0.3, open_len: 0.5, banner: "IMAGINE 100 DOORS", after: "NOW SWITCH?" }

  - id: reveal
    lines:
      - id: L08
        sticker: goal_achieved
        line: "So always switch!"
        punch: true
        confetti: true
        confetti_at: 0.2
        doors: { picked: 2, open: { 3: goat, 2: car }, open_at: 0.05, banner: "ALWAYS SWITCH!" }
      - id: L09
        line: "Would you have switched? Tell us in the comments!"
        doors: { picked: 2, open: { 3: goat, 2: car }, animate_open: false, banner: "WOULD YOU SWITCH?", banner_color: yellow }
