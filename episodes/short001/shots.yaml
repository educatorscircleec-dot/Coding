# SHORT001 — How Do Animals Sleep?  (45 s, vertical, narrated by the EduCrew host)
#
# Voice drives the timing: each line is its own audio file in output/short001/lines/<id>.mp3
# (ElevenLabs, voice "Jessica"). `python -m studio short short001` measures every line and
# builds one synced timeline: shot cuts, captions (word highlight) and map pins all follow the voice.
# Animated pictures: output/short001/wan/<clip>.mp4, made by scripts/wan_batch.py from
# episodes/short001/animation.yaml.
episode: short001
title: How Do Animals Sleep?
resolution: [1080, 1920]
fps: 24
target_seconds: 45
music_level: 0.42
fallback_clips_dir: test_clips   # stand-ins until every Wan clip exists
alt_clips_dir: motion            # free live-motion clips (python -m studio livemotion)

shots:
  - id: hook
    clip: hook
    characters: [host]
    title: HOW DO ANIMALS SLEEP?
    sticker: pose_thinking
    lines:
      - { id: L01, character: host, line: "Did you know animals sleep in the strangest ways?" }

  - id: flamingo
    clip: flamingo
    characters: [host]
    lines:
      - { id: L02, character: host, line: "Flamingos often snooze on one leg." }
      - { id: L03, character: host, line: "Tucking the other leg in may help them stay warm." }
      - { id: M_flamingo, character: host, map_line: true, line: "Most of them live around the salty lakes of East Africa." }
    map:
      label: "Most found: East Africa's salty lakes"
      region: [24, 52, -12, 10]
      pins: [[0.25, 36.1], [-0.36, 36.08], [-2.42, 36.0], [-1.9, 36.3]]   # Bogoria, Nakuru, Natron, Magadi

  - id: bats
    clip: bats
    characters: [host]
    lines:
      - { id: L04, character: host, line: "Bats sleep hanging upside down by their feet." }
      - { id: L05, character: host, line: "When they wake up, they just let go and fly!" }
      - { id: M_bats, character: host, map_line: true, line: "Most kinds of bats live in warm, tropical rainforests." }
    map:
      label: "Most found: tropical rainforests"
      pins: [[-3, -62], [-8, -55], [0, 22], [2, 15], [1, 114], [-3, 120]]  # Amazon, Congo, SE Asia

  - id: dolphin
    clip: dolphin
    characters: [host]
    lines:
      - { id: L06, character: host, line: "Dolphins rest one half of their brain at a time." }
      - { id: L07, character: host, line: "The other half stays alert, with one eye open!" }
      - { id: M_dolphin, character: host, map_line: true, line: "You'll find them in warm coastal seas all around the world." }
    map:
      label: "Most found: warm coastal seas"
      pins: [[27, -88], [26, -80], [37, 15], [-28, 154], [-33, 27]]

  - id: otters
    clip: otters
    characters: [host]
    lines:
      - { id: L08, character: host, line: "Sea otters hold paws while they sleep." }
      - { id: L09, character: host, line: "That way, they don't drift apart!" }
      - { id: M_otter, character: host, map_line: true, line: "Most sea otters live along the coast of Alaska." }
    map:
      label: "Most found: the coast of Alaska"
      region: [-180, -125, 48, 66]
      pins: [[52.5, -172], [57.5, -152.5], [60.6, -147], [57, -135]]

  - id: giraffe
    clip: giraffe
    characters: [host]
    lines:
      - { id: L10, character: host, line: "Giraffes nap for just a few minutes at a time." }
      - { id: L11, character: host, line: "They rest their head on their back, like a pillow!" }
      - { id: M_giraffe, character: host, map_line: true, line: "Most giraffes roam the savannas of East and Southern Africa." }
    map:
      label: "Most found: East & Southern Africa"
      region: [5, 45, -32, 8]
      pins: [[-1.5, 35.1], [-2.5, 34.9], [-19.5, 23.5], [-19, 16], [-24, 31.5]]

  - id: outro
    clip: outro
    characters: [host]
    title: WHICH ONE ARE YOU?
    sticker: pose_front
    lines:
      - { id: L12, character: host, line: "Which animal sleeps most like you?" }
      - { id: L13, character: host, line: "Tell us in the comments!" }
