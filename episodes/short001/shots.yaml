# 45 s vertical short. Host = your EduCrew character (brand/stickers/).
# Scene images: AI background (output/short001/backgrounds/<id>.jpg) + sticker + logo,
# built with `python -m studio compose short001`.
# camera: how the virtual camera moves; map: where the animal lives (lat, lon pins)
episode: short001
title: How Do Animals Sleep?
resolution:
- 1080
- 1920
shots:
- id: s010
  location: bedroom
  characters:
  - host
  framing: close-up, vertical frame
  action: the host with a thoughtful look, an idea lightbulb above her
  motion: the host taps her chin, then her eyes light up with an idea
  dialogue:
  - character: host
    line: Wait... do ANIMALS get sleepy too?
  duration: 4
  sticker: big_ideas
  sticker_side: left
  focus_x: 0.4
  title: HOW DO ANIMALS SLEEP?
  camera:
    move: push_in
    amount: 0.12
