# Wan 2.2 image-to-video jobs for short001 (one 5 s clip per scene; the renderer
# stretches it to the shot). Re-run any time: finished clips are skipped.
output: output/short001/wan
parallel: 1
jobs:
  hook:
    image: output/short001/backgrounds/s100.jpg
    segments:
    - prompt: the sleeping cartoon animals on the fluffy clouds breathe softly and snuggle, clouds drift slowly,
        stars twinkle, the moon glows
      seconds: 3.4
  flamingo:
    image: output/short001/backgrounds/s030.jpg
    segments:
    - prompt: the pink flamingo sleeps standing on one leg with its head tucked in its feathers, gently breathing
        and swaying, water ripples around its leg, stars twinkle, then the flamingo slowly lifts its head, blinks,
        looks around and gently fluffs its wings, still standing on one leg, lily pads bob on the water
      seconds: 5.0
  bats:
    image: output/short001/backgrounds/s040.jpg
    segments:
    - prompt: the three bats hang upside down asleep from the branch, gently swaying, then the middle bat opens
        its wings, lets go of the branch and flies away, then the bat flies in a loop across the big moon while
        the other bats sway gently on the branch, grass moves in the breeze
      seconds: 5.0
  dolphin:
    image: output/short001/backgrounds/s050.jpg
    segments:
    - prompt: the dolphin rests floating at the water surface with one eye open and one eye closed, gently bobbing
        up and down, bubbles rise, moonlight shimmers, then the dolphin slowly swims forward and gently arches its
        back, small splash, waves sparkle in the moonlight
      seconds: 5.0
  otters:
    image: output/short001/backgrounds/s060.jpg
    segments:
    - prompt: the two sea otters float asleep on their backs holding paws, gently bobbing on the waves together,
        kelp sways, then the two otters keep holding paws and slowly drift and spin together on the calm waves,
        the sun glows on the water
      seconds: 5.0
  giraffe:
    image: output/short001/backgrounds/s070.jpg
    segments:
    - prompt: the giraffe sleeps lying down with its head resting on its back like a pillow, breathing slowly, the
        acacia tree sways, stars twinkle, then the giraffe wakes up, slowly lifts its long neck high, blinks and
        looks around the savanna
      seconds: 5.0
  outro:
    image: output/short001/backgrounds/s010.jpg
    segments:
    - prompt: cozy bedroom at night, the little lamp glows warmly, curtains sway gently, stars twinkle outside the
        window, the moon smiles
      seconds: 4.0
