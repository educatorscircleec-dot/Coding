# Free, CPU-only "live" animation for scenes that don't have an AI (Wan) clip yet.
# Positions are fractions of the square picture (cx, cy = centre; rx, ry = radius).
# `lines: [i]` limits an effect to narration line i of that shot (0 = first line).
output: output/short001/motion
scenes:
  # dolphin, otters, giraffe: the animal is cut out and moved as a solid piece
  # (no warping); the background moves underneath.
  dolphin:
    image: output/short001/backgrounds/s050.jpg
    layered: true
    keep: { cx: 0.48, cy: 0.31, rx: 0.46, ry: 0.22 }
    background:
      - { type: ripple, y0: 0.38, amp: 1.2 }
      - { type: ripple, y0: 0.38, amp: 1.2, speed: 1.8, lines: [2] }
      - { type: twinkle, y_max: 0.28, lum: 190 }
      - { type: glow, cx: 0.74, cy: 0.10, rx: 0.12, ry: 0.10, color: [255, 240, 200] }
    animal:
      - { type: bob, amp: 1.0 }
      - { type: bob, amp: 1.4, speed: 1.6, lines: [2] }
      - { type: tilt, px: 0.48, py: 0.33, amp: 0.8 }
      # "You'll find them in warm coastal seas": swims forward, nose up
      - { type: swim, x: -0.018, y: -0.006, lines: [2] }
      - { type: tilt, px: 0.48, py: 0.33, amp: 1.2, speed: 2.0, lines: [2] }
    overlays:
      - { type: zzz, cx: 0.22, cy: 0.17, lines: [0] }
      # "with one eye open!": the open eye pops
      - { type: pop, cx: 0.46, cy: 0.355, r: 0.035, lines: [1] }
  otters:
    image: output/short001/backgrounds/s060.jpg
    layered: true
    background:
      - { type: ripple, y0: 0.22, amp: 1.2 }
      - { type: ripple, y0: 0.22, amp: 1.8, speed: 1.6, lines: [1] }
      - { type: glow, cx: 0.85, cy: 0.18, rx: 0.12, ry: 0.07, color: [255, 200, 150] }
    animal:
      - { type: bob, amp: 1.0 }
      - { type: tilt, px: 0.48, py: 0.45, amp: 1.3 }
      - { type: breathe, px: 0.48, py: 0.45, amp: 0.6 }
      # "That way, they don't drift apart!": bigger waves rock them, together
      - { type: tilt, px: 0.48, py: 0.45, amp: 1.6, speed: 1.5, lines: [1] }
      - { type: bob, amp: 1.0, speed: 1.4, ph: 1.0, lines: [1] }
      # "Most sea otters live along the coast of Alaska": they drift slowly together
      - { type: swim, x: 0.015, y: 0.006, lines: [2] }
  giraffe:
    image: output/short001/backgrounds/s070.jpg
    layered: true
    background:
      - { type: sway, cx: 0.15, cy: 0.20, rx: 0.17, ry: 0.10, y_top: 0.1, y_len: 0.2, amp: 1.2 }
      - { type: sway, cx: 0.10, cy: 0.90, rx: 0.10, ry: 0.10, y_top: 0.8, y_len: 0.2, amp: 1.5 }
      - { type: sway, cx: 0.90, cy: 0.90, rx: 0.10, ry: 0.10, y_top: 0.8, y_len: 0.2, amp: 1.5, ph: 1 }
      - { type: twinkle, y_max: 0.30, lum: 200 }
      - { type: glow, cx: 0.76, cy: 0.10, rx: 0.08, ry: 0.07, color: [255, 245, 210] }
    animal:
      - { type: breathe, px: 0.47, py: 0.82, amp: 1.3, speed: 0.9 }
      - { type: tilt, px: 0.47, py: 0.82, amp: 0.25, speed: 0.7 }
      # "They rest their head on their back, like a pillow!": the body relaxes and sinks a little
      - { type: settle, px: 0.47, py: 0.82, amount: 0.025, lines: [1] }
    overlays:
      - { type: zzz, cx: 0.72, cy: 0.27, lines: [1, 2] }
  outro:
    image: output/short001/backgrounds/s010.jpg
    recipe:
      - { type: glow, cx: 0.12, cy: 0.50, rx: 0.10, ry: 0.10, color: [255, 210, 140], amp: 1.3 }
      - { type: glow, cx: 0.73, cy: 0.27, rx: 0.12, ry: 0.06, color: [255, 230, 160], amp: 1.3, speed: 2.5 }
      - { type: glow, cx: 0.13, cy: 0.20, rx: 0.08, ry: 0.08, color: [255, 245, 200] }
      - { type: sway, cx: 0.04, cy: 0.35, rx: 0.07, ry: 0.25, y_top: 0.6, y_len: -0.5, amp: 0.8 }
      - { type: sway, cx: 0.30, cy: 0.30, rx: 0.05, ry: 0.18, y_top: 0.5, y_len: -0.4, amp: 0.8, ph: 1 }
      - { type: breathe, cx: 0.68, cy: 0.45, rx: 0.05, ry: 0.04, amp: 1.2 }
      - { type: twinkle, y_max: 0.35, lum: 215 }
