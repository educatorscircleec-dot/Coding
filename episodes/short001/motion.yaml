# Free, CPU-only "live" animation for scenes that don't have an AI (Wan) clip yet.
# Positions are fractions of the square picture (cx, cy = centre; rx, ry = radius).
# `lines: [i]` limits an effect to narration line i of that shot (0 = first line).
output: output/short001/motion
scenes:
  dolphin:
    image: output/short001/backgrounds/s050.jpg
    recipe:
      - { type: ripple, y0: 0.40, amp: 1.0 }
      - { type: bob, cx: 0.48, cy: 0.32, rx: 0.40, ry: 0.19, amp: 1.5 }
      - { type: breathe, cx: 0.48, cy: 0.32, rx: 0.36, ry: 0.15, amp: 0.6, lines: [0] }
      - { type: zzz, cx: 0.22, cy: 0.20, lines: [0] }
      # "with one eye open!": the open eye pops to draw attention
      - { type: pop, cx: 0.46, cy: 0.355, rx: 0.05, ry: 0.05, amp: 1.0, lines: [1] }
      # "You'll find them in warm coastal seas": the dolphin swims forward
      - { type: shift, cx: 0.48, cy: 0.32, rx: 0.42, ry: 0.2, x: -0.07, y: 0.01, lines: [2] }
      - { type: ripple, y0: 0.40, amp: 1.0, speed: 1.8, lines: [2] }
      - { type: twinkle, y_max: 0.30, lum: 190 }
      - { type: glow, cx: 0.74, cy: 0.10, rx: 0.12, ry: 0.10, color: [255, 240, 200] }
  otters:
    image: output/short001/backgrounds/s060.jpg
    recipe:
      - { type: ripple, y0: 0.22, amp: 1.0 }
      - { type: bob, cx: 0.48, cy: 0.42, rx: 0.26, ry: 0.15, amp: 1.0 }
      - { type: rock, cx: 0.48, cy: 0.42, rx: 0.26, ry: 0.15, amp: 0.7 }
      - { type: breathe, cx: 0.37, cy: 0.38, rx: 0.10, ry: 0.10, amp: 0.8 }
      - { type: breathe, cx: 0.62, cy: 0.38, rx: 0.10, ry: 0.10, amp: 0.8, speed: 1.15 }
      # "That way, they don't drift apart!": bigger waves, they rock together
      - { type: rock, cx: 0.48, cy: 0.42, rx: 0.28, ry: 0.16, amp: 1.3, speed: 1.4, lines: [1] }
      - { type: ripple, y0: 0.22, amp: 1.6, speed: 1.6, lines: [1] }
      - { type: sway, cx: 0.33, cy: 0.55, rx: 0.15, ry: 0.10, y_top: 0.45, y_len: 0.25, amp: 1.5 }
      - { type: sway, cx: 0.75, cy: 0.55, rx: 0.15, ry: 0.10, y_top: 0.45, y_len: 0.25, amp: 1.5, ph: 1.5 }
      # "Most sea otters live along the coast of Alaska": they drift slowly together
      - { type: shift, cx: 0.48, cy: 0.42, rx: 0.30, ry: 0.18, x: 0.05, y: 0.02, lines: [2] }
      - { type: glow, cx: 0.85, cy: 0.18, rx: 0.12, ry: 0.07, color: [255, 200, 150] }
  giraffe:
    image: output/short001/backgrounds/s070.jpg
    recipe:
      - { type: breathe, cx: 0.47, cy: 0.62, rx: 0.33, ry: 0.22, amp: 1.4 }
      - { type: rock, cx: 0.62, cy: 0.40, rx: 0.16, ry: 0.14, amp: 0.9, speed: 0.9 }
      # "nap for just a few minutes": the head nods sleepily
      - { type: bob, cx: 0.66, cy: 0.36, rx: 0.13, ry: 0.13, amp: 1.8, speed: 1.3, lines: [0] }
      # "rest their head on their back, like a pillow!": the head settles down onto the body
      - { type: shift, cx: 0.66, cy: 0.36, rx: 0.16, ry: 0.16, soft: 0.9, x: -0.012, y: 0.025, lines: [1] }
      - { type: zzz, cx: 0.72, cy: 0.27, lines: [1, 2] }
      - { type: sway, cx: 0.15, cy: 0.20, rx: 0.17, ry: 0.10, y_top: 0.1, y_len: 0.2, amp: 1.2 }
      - { type: sway, cx: 0.10, cy: 0.90, rx: 0.10, ry: 0.10, y_top: 0.8, y_len: 0.2, amp: 1.5 }
      - { type: sway, cx: 0.90, cy: 0.90, rx: 0.10, ry: 0.10, y_top: 0.8, y_len: 0.2, amp: 1.5, ph: 1 }
      - { type: twinkle, y_max: 0.30, lum: 200 }
      - { type: glow, cx: 0.76, cy: 0.10, rx: 0.08, ry: 0.07, color: [255, 245, 210] }
  outro:
    image: output/short001/backgrounds/s010.jpg
    recipe:
      - { type: glow, cx: 0.12, cy: 0.50, rx: 0.10, ry: 0.10, color: [255, 210, 140], amp: 1.3 }
      - { type: glow, cx: 0.73, cy: 0.27, rx: 0.12, ry: 0.06, color: [255, 230, 160], amp: 1.3, speed: 2.5 }
      - { type: glow, cx: 0.13, cy: 0.20, rx: 0.08, ry: 0.08, color: [255, 245, 200] }
      - { type: sway, cx: 0.04, cy: 0.35, rx: 0.07, ry: 0.25, y_top: 0.6, y_len: -0.5, amp: 0.8 }
      - { type: sway, cx: 0.30, cy: 0.30, rx: 0.05, ry: 0.18, y_top: 0.5, y_len: -0.4, amp: 0.8, ph: 1 }
      - { type: breathe, cx: 0.68, cy: 0.45, rx: 0.05, ry: 0.04, amp: 1.2 }
      - { type: twinkle, y_max: 0.35, lum: 215 }
